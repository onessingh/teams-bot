name: Automation Worker

on:
  repository_dispatch:
    types: [start-processing]
  workflow_dispatch: 

jobs:
  process-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - run: npm install
      - run: npx playwright install chromium --with-deps
      
      - name: Setup Virtual Audio/Video
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg dbus-x11
          pulseaudio -D --exit-idle-time=-1
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run Bot
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          MS_COOKIES_BASE64: ${{ secrets.MS_COOKIES_BASE64 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm start
