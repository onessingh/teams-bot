name: Test Solmates Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Test Solmates Upload
        env:
          SOLMATES_ADMIN_ID: ${{ secrets.SOLMATES_ADMIN_ID }}
          SOLMATES_ADMIN_PASSWORD: ${{ secrets.SOLMATES_ADMIN_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: node scratch/test_solmates_upload.js
