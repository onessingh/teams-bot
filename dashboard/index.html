<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams Class Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; }
        .queue-item { transition: all 0.2s ease-in-out; }
        .queue-item:hover { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        /* Modal Styles */
        .modal-overlay { display: none; }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body class="text-gray-800 p-3 md:p-6">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-sm p-4 md:p-6 border border-gray-100">
        
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-gray-100">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 <span class="tracking-tight">Class Bot</span>
            </h1>
            <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
                <span id="teams-status" class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 border border-gray-200">
                    Teams: ❌ Expired
                </span>
                <button id="settings-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition-colors shadow-sm">
                    Login Teams
                </button>
            </div>
        </div>
        
        <!-- Input Section -->
        <div class="flex flex-col gap-3 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
            <input type="text" id="teams-link" placeholder="Paste Teams recording link here..." 
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
            
            <div class="flex gap-2">
                <div class="flex-1 relative">
                    <input type="number" id="teams-duration" placeholder="Duration" value="300"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                    <span class="absolute right-3 top-3 text-xs text-gray-400 pointer-events-none mt-0.5">mins</span>
                </div>
                <button id="add-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg text-sm font-bold transition-colors shadow-sm">
                    Add to Queue
                </button>
            </div>
            <p class="text-[11px] text-gray-500 text-center mt-1">Hint: Change duration to 5 for a quick 5-min test!</p>
        </div>

        <!-- Queue Section -->
        <div>
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Processing Queue</h2>
            <ul id="queue-list" class="flex flex-col gap-3">
                <div class="text-center text-gray-400 py-8 text-sm">Queue is empty. Add a link above.</div>
            </ul>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay fixed inset-0 bg-black/60 z-50 items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-xl transform transition-all">
            <h2 class="text-xl font-bold mb-1">Microsoft Teams</h2>
            <p class="text-xs text-gray-500 mb-5">Securely save cookies for automated recording.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">College Email</label>
                    <input type="text" id="ms-email" placeholder="student@college.edu" 
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
                    <input type="password" id="ms-password" placeholder="••••••••" 
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                
                <div class="pt-2 flex flex-col gap-2">
                    <button id="start-login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-bold transition-colors shadow-sm">
                        Start Auto Login
                    </button>
                    <button id="close-modal-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-bold transition-colors">
                        Cancel
                    </button>
                </div>
            </div>

            <div id="mfa-section" class="hidden mt-6 pt-5 border-t border-gray-100 text-center">
                <div id="mfa-status-text" class="text-sm font-bold text-blue-600 mb-3 animate-pulse">Starting browser...</div>
                <img id="mfa-screenshot" src="" alt="MFA Screen" class="hidden w-full rounded-lg shadow-md border border-gray-200">
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=2"></script>
</body>
</html>
